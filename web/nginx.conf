# Serves the built PWA under /badger/; TLS and routing live in the Pi's gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The service worker decides when the app updates, so the files it compares must never
    # be served stale by the browser cache — otherwise a publish can take a day to show up.
    location ~ ^/badger/(index\.html|ngsw\.json|ngsw-worker\.js|custom-sw\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Content-hashed bundles (outputHashing: all) can be cached forever.
    location ~ "^/badger/.+-[A-Za-z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/badger/settings, …) fall back to the app shell.
    location /badger/ {
        try_files $uri $uri/ /badger/index.html;
    }
}
