# Production deployment on a Raspberry Pi: PostgreSQL, the API and the web PWA, published
# over HTTPS by the gateway in deploy/gateway (https://<pi>/badger and /badger-api).
# deploy/publish.sh builds the images, ships them and runs this file; see the README.
#
# The project name is pinned so the data volume is always relentlessbadger_pgdata, whatever
# directory this file sits in on the Pi — a different name would mean a fresh, empty database.
name: relentlessbadger

services:
  postgres:
    image: postgres:17-alpine
    container_name: relentlessbadger-db
    environment:
      POSTGRES_USER: badger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: relentlessbadger
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Shared with the host so deploy/backup.sh's dumps land on the Pi's disk.
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badger -d relentlessbadger"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    image: ${API_IMAGE:-relentlessbadger-api:latest}
    container_name: relentlessbadger-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=relentlessbadger;Username=badger;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?set it in .env}
      Auth__GoogleClientId: ${GOOGLE_CLIENT_ID:-}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-}
    # No published port: only the gateway reaches the API, as /badger-api.
    networks:
      - default
      - gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    image: ${WEB_IMAGE:-relentlessbadger-web:latest}
    container_name: relentlessbadger-web
    networks:
      - gateway
    restart: unless-stopped

volumes:
  pgdata:

networks:
  gateway:
    external: true
