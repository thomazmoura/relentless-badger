worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Sites address their upstreams through variables, which nginx resolves per request via
    # Docker's DNS. A literal hostname would be resolved at startup instead, so one app
    # being down (or not deployed yet) would stop the whole gateway from starting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The Tailscale name has a certificate, so plain HTTP to it is sent over to HTTPS.
    server {
        listen 80;
        server_name ~\.ts\.net$;
        return 301 https://$host$request_uri;
    }

    # Anything else on port 80 — the LAN IP, a bare hostname — gets the sites over plain
    # HTTP: the certificate only covers the ts.net name, so HTTPS there would just be a
    # browser warning. Being no secure context, it has no service worker (offline, alarms)
    # and no Google sign-in; the full app lives on the ts.net name.
    server {
        listen 80 default_server;
        server_name _;

        include /etc/nginx/gateway/sites/*.conf;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        include /etc/nginx/gateway/sites/*.conf;
    }
}
