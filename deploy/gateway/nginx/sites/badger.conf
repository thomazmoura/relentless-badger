# RelentlessBadger: the PWA under /badger/, the API under /badger-api/. Same origin, so the
# browser needs no CORS. Container names come from docker-compose.prod.yml.

location = /badger {
    return 301 /badger/;
}

# The web container serves the app under /badger/ itself, so the path passes through as is.
location /badger/ {
    set $badger_web relentlessbadger-web;
    proxy_pass http://$badger_web:80;
}

# The API knows nothing about the prefix, so it is stripped here (/badger-api/tasks → /tasks).
location /badger-api/ {
    set $badger_api relentlessbadger-api;
    rewrite ^/badger-api/(.*)$ /$1 break;
    proxy_pass http://$badger_api:5000;
}
